name: Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true

    # Both steps go through Rake so the task definitions in rakelib/lint.rake
    # are the single authoritative description of the lint gate. Adding a
    # linter to `rake lint` then takes effect in CI without editing this file.
    - name: Run RuboCop
      run: bundle exec rake lint

    - name: Check for files missing newlines
      run: bundle exec rake check_newlines
